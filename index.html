<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly Battles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Wordly Battles</h1>
    <button id="multiplayer-button">Multiplayer</button>
    <p id="room-code-display"></p>
    <button id="leave-room-button" hidden>Leave Game</button>
    <p id="game-message"></p>
    <p id="room-error-message"></p>
    <p id="multiplayer-status-message"></p>
    <input id="room-code-input" type="text" placeholder="Enter room code">
    <button id="join-room-button">Join Room</button>
    <div class="board" id="board"></div>
    <button id="play-again" hidden>Play Again</button>
    <div class="keyboard" id="keyboard"></div>

    <script src="http://localhost:3000/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
