<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly Battles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Page Header -->
    <header>
        <h1>Wordly Battles</h1>
    </header>

    <main>
        <!-- Game controls and status messages -->
        <section class="game-controls" aria-label="Game controls">
            <!-- Create multiplayer room -->
            <div class="create-room-controls">
                <span>Create multiplayer room:</span>
                <button id="multiplayer-button">Create Room</button>
            </div>

            <!-- Join multiplayer room -->
            <div class="join-room-controls">
                <label for="room-code-input">Join multiplayer room:</label>
                <input id="room-code-input" type="text" placeholder="Enter room code">
                <button id="join-room-button">Join</button>
            </div>

            <!-- Active room code -->
            <p id="room-code-display" class="hide-when-empty"></p>

            <!-- Leave room button -->
            <button id="leave-room-button" hidden>Leave Multiplayer Game</button>
        
            <!-- Game messages -->
            <p id="game-message" class="hide-when-empty" role="status"></p>
            <p id="room-error-message" class="hide-when-empty" role="alert"></p>
            <p id="multiplayer-status-message" class="hide-when-empty" role="status"></p>

            <!-- Play again button -->
            <button id="play-again" hidden>Play Again</button>
        </section>

        <!-- Game boards -->
        <section class="boards-container" aria-label="Game boards">
            <div class="board" id="board" role="group" aria-label="Your game board"></div>
            <div class="opponent-board" id="opponent-board" role="group" aria-label="Opponent game board" hidden></div>
        </section>

        <!-- On-screen keyboard -->
        <section class="keyboard" id="keyboard" aria-label="On-screen keyboard"></section>
    </main>

    <!-- Scripts -->
    <script src="http://localhost:3000/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
